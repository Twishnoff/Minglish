<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Speaking Practice</title>
  <link rel="stylesheet" href="styles.css?v=10" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
</head>
<body>

  <!-- Login screen -->
  <section id="login-screen" class="screen">
    <div class="login-card">
      <img src="assets/minglish-logo-stacked.png" alt="Minglish" class="login-logo" />
      <h1>English Speaking Practice</h1>
      <p class="muted">Enter your email to continue.</p>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
        <button type="submit">Log In</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <!-- Main app -->
  <section id="app-screen" class="screen" hidden>
    <header id="top-bar">
      <div class="top-bar-logo">
        <img src="assets/minglish-logo.png" alt="Minglish" />
      </div>
      <div class="top-bar-row">
        <div class="top-bar-item">
          <span class="top-bar-label">🔥 Streak</span>
          <span id="streak-value" class="top-bar-value">0</span>
        </div>
        <div class="top-bar-item">
          <span class="top-bar-label">Today's Performance:</span>
          <span id="performance-value" class="top-bar-value">—</span>
        </div>
        <button id="logout-btn" class="logout-btn">Log Out</button>
      </div>
    </header>

    <main>
      <section id="practice-box" class="card">
        <div class="card-header">
          <h2>Speaking Practice</h2>
          <span id="word-counter" class="word-counter">0/20</span>
        </div>

        <div id="word-display-wrap">
          <button id="word-display" class="word-display" type="button"></button>

          <div class="ipa-row">
            <span id="word-ipa" class="word-ipa"></span>
            <button id="speak-btn" class="speak-btn" title="Hear it spoken" type="button">🔊</button>
          </div>

          <div id="word-popup" class="word-popup" hidden>
            <p id="popup-mandarin" class="popup-mandarin-text"></p>
            <button id="popup-close" class="popup-close" title="Close" type="button">✕</button>
          </div>
        </div>

        <div class="mic-wrap">
          <div class="mic-cluster">
            <button id="mic-btn" class="mic-btn" type="button">
              <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10a1 1 0 0 1 2 0 5 5 0 0 0 10 0 1 1 0 0 1 2 0 7 7 0 0 1-6 6.92V19h2a1 1 0 0 1 0 2H9a1 1 0 0 1 0-2h2v-2.08A7 7 0 0 1 5 10z"/>
              </svg>
            </button>

            <!-- Replays the user's own most recent recording for the word on
                 screen. Disabled until there's something to play (see
                 updateReplayButton in app.js). -->
            <button id="replay-btn" class="replay-btn" type="button" disabled
                    title="Record an attempt first to hear it back"
                    aria-label="Replay your last attempt">
              <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.9 5.8 A9 9 0 1 1 8.9 4.2"/>
                  <path d="M8.9 4.2 C10.6 3.2 12.6 2.8 14.6 3.0"/>
                  <path d="M12.3 0.9 L15.2 3.3 L12.3 5.7"/>
                </g>
                <path d="M10.0 8.5 L16.7 12.8 L10.0 17.1 Z"
                      fill="currentColor" stroke="currentColor"
                      stroke-width="1.7" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
          <p id="mic-status" class="mic-status">Tap the mic to begin speaking the word. Tap again when finished to submit.</p>
        </div>

        <p id="attempt-feedback" class="attempt-feedback" hidden></p>

        <div class="nav-arrows">
          <button id="prev-btn" class="arrow-btn" type="button">◀</button>
          <div id="example-box" class="example-box">
            <span class="example-label">EXAMPLE</span>
            <p id="example-sentence" class="example-sentence"></p>
          </div>
          <button id="next-btn" class="arrow-btn" type="button">▶</button>
        </div>
      </section>

      <section id="chart-box" class="card">
        <div class="card-header">
          <h2>Performance Over Time</h2>
        </div>
        <canvas id="performance-chart" height="90"></canvas>
        <p id="chart-empty" class="muted" hidden>No history yet — come back tomorrow to see your trend.</p>
      </section>
    </main>
  </section>

  <script src="recordings.js?v=10"></script>
  <script src="app.js?v=10"></script>
</body>
</html>
