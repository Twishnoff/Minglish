<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>English Speaking Practice</title>
  <link rel="stylesheet" href="styles.css?v=5" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>

  <!-- Login screen -->
  <section id="login-screen" class="screen">
    <div class="login-card">
      <h1>English Speaking Practice</h1>
      <p class="muted">Enter your email to continue.</p>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email" />
        <button type="submit">Log In</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <!-- Main app -->
  <section id="app-screen" class="screen" hidden>
    <header id="top-bar">
      <div class="top-bar-item">
        <span class="top-bar-label">🔥 Streak</span>
        <span id="streak-value" class="top-bar-value">0</span>
      </div>
      <div class="top-bar-item">
        <span class="top-bar-label">Today's Performance:</span>
        <span id="performance-value" class="top-bar-value">—</span>
      </div>
      <button id="logout-btn" class="logout-btn">Log Out</button>
    </header>

    <main>
      <section id="practice-box" class="card">
        <div class="card-header">
          <h2>Speaking Practice</h2>
          <span id="word-counter" class="word-counter">0/10</span>
        </div>

        <div id="word-display-wrap">
          <button id="word-display" class="word-display" type="button"></button>

          <div id="word-popup" class="word-popup" hidden>
            <button id="popup-speak" class="popup-icon-btn" title="Hear it spoken" type="button">🔊</button>
            <button id="popup-translate" class="popup-icon-btn" title="Show Mandarin" type="button">中</button>
            <button id="popup-close" class="popup-icon-btn popup-close" title="Close" type="button">✕</button>
          </div>
          <p id="mandarin-text" class="mandarin-text" hidden></p>
        </div>

        <div class="mic-wrap">
          <button id="mic-btn" class="mic-btn" type="button">🎤</button>
          <p id="mic-status" class="mic-status">Tap the mic and say the word or phrase above.</p>
        </div>

        <p id="attempt-feedback" class="attempt-feedback" hidden></p>

        <div class="nav-arrows">
          <button id="prev-btn" class="arrow-btn" type="button">◀</button>
          <button id="next-btn" class="arrow-btn" type="button">▶</button>
        </div>
      </section>

      <section id="chart-box" class="card">
        <div class="card-header">
          <h2>Performance Over Time</h2>
        </div>
        <canvas id="performance-chart" height="90"></canvas>
        <p id="chart-empty" class="muted" hidden>No history yet — come back tomorrow to see your trend.</p>
      </section>
    </main>
  </section>

  <script src="app.js?v=5"></script>
</body>
</html>
